<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="theme-color" content="transparent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="読書管理アプリ - あなたの本棚をデジタルで管理">
    <title>わたしの本棚</title>
    <link rel="icon" type="image/x-icon" href="img/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="img/favicon/favicon-48.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- ローディング画面 -->
    <div class="page-loader" id="page-loader">
        <div class="spinner"></div>
        <div class="loader-text">読み込み中...</div>
    </div>

    <div class="page-content" id="page-content">

        <div id="message"></div>


        <div class="form-container">
        <form id="book-form" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="title">タイトル <span style="color: red;">*</span></label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="title" name="title" required style="flex: 1;">
                    <button type="button" onclick="openSearchModal()" class="search-btn" style="white-space: nowrap;">🔍 検索</button>
                </div>
            </div>

            <div class="form-group">
                <label for="status">状態</label>
                <select id="status" name="status">
                    <option value="未読">未読</option>
                    <option value="読書中">読書中</option>
                    <option value="読了">読了</option>
                </select>
            </div>

            <div class="form-group">
                <label for="start_date">開始日</label>
                <input type="date" id="start_date" name="start_date">
            </div>

            <div class="form-group">
                <label for="end_date">終了日</label>
                <input type="date" id="end_date" name="end_date">
            </div>

            <div class="form-group">
                <label for="rating">評価（5段階）</label>
                <select id="rating" name="rating">
                    <option value="">未評価</option>
                    <option value="1">★☆☆☆☆ (1)</option>
                    <option value="2">★★☆☆☆ (2)</option>
                    <option value="3">★★★☆☆ (3)</option>
                    <option value="4">★★★★☆ (4)</option>
                    <option value="5">★★★★★ (5)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cover_image">表紙画像</label>
                <input type="file" id="cover_image" name="cover_image" accept="image/*" onchange="previewImage(event)">
                <img id="preview" class="image-preview" style="display: none;">
            </div>

            <div class="form-group">
                <label for="review">書評</label>
                <textarea id="review" name="review" placeholder="この本についての感想や書評を書いてください..."></textarea>
            </div>

            <div class="form-actions">
                <button type="button" onclick="location.href='index.html'">キャンセル</button>
                <button type="submit" class="primary" id="submit-btn">登録</button>
            </div>
        </form>
    </div>
    </div>

    <!-- 検索モーダル -->
    <div id="search-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>書籍を検索</h2>
                <button class="modal-close" onclick="closeSearchModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="search-input-container">
                    <input type="text" id="search-input" placeholder="書籍名を入力..." onkeypress="if(event.key==='Enter') searchBooks()">
                    <button onclick="searchBooks()" class="primary">検索</button>
                </div>
                <div id="search-results"></div>
            </div>
        </div>
    </div>

    <script>
        let editMode = false;
        let currentBookId = null;
        let currentCoverImage = null;
        let selectedBookFromSearch = null;

        // ページ読み込み時
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const bookId = params.get('id');

            if (bookId) {
                editMode = true;
                currentBookId = bookId;
                document.getElementById('submit-btn').textContent = '更新';
                loadBookForEdit(bookId);
            } else {
                // 新規登録の場合は即座にローダーを非表示
                hideLoader();
            }
        });

        // 編集用に書籍を読み込む
        async function loadBookForEdit(id) {
            try {
                const response = await fetch(`api/books.php?id=${id}`);
                if (!response.ok) {
                    throw new Error('書籍の取得に失敗しました');
                }

                const book = await response.json();
                currentCoverImage = book.cover_image;

                // フォームに値をセット
                document.getElementById('title').value = book.title || '';
                document.getElementById('status').value = book.status || '未読';
                document.getElementById('start_date').value = book.start_date || '';
                document.getElementById('end_date').value = book.end_date || '';
                document.getElementById('rating').value = book.rating || '';
                document.getElementById('review').value = book.review || '';

                // 画像プレビュー
                if (book.cover_image) {
                    const preview = document.getElementById('preview');
                    preview.src = book.cover_image;
                    preview.style.display = 'block';

                    // 画像読み込み後にローダーを非表示
                    preview.onload = () => hideLoader();
                } else {
                    hideLoader();
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('書籍の読み込みに失敗しました: ' + error.message, 'error');
                hideLoader();
            }
        }

        // ローダーを非表示にしてページをフェードイン
        function hideLoader() {
            const loader = document.getElementById('page-loader');
            const content = document.getElementById('page-content');

            loader.classList.add('hidden');

            setTimeout(() => {
                content.classList.add('visible');
            }, 100);

            setTimeout(() => {
                loader.style.display = 'none';
            }, 600);
        }

        // 画像プレビュー
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // フォーム送信
        async function submitForm(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '処理中...';

            try {
                // 画像をアップロード
                let coverImagePath = currentCoverImage;
                const imageFile = document.getElementById('cover_image').files[0];

                if (imageFile) {
                    coverImagePath = await uploadImage(imageFile);
                } else if (window.selectedBookImageUrl) {
                    // 検索から選択した画像URLがある場合、それをダウンロードして保存
                    coverImagePath = await downloadAndUploadImage(window.selectedBookImageUrl);
                }

                // 書籍データを準備
                const bookData = {
                    title: document.getElementById('title').value,
                    status: document.getElementById('status').value,
                    start_date: document.getElementById('start_date').value || null,
                    end_date: document.getElementById('end_date').value || null,
                    rating: document.getElementById('rating').value || null,
                    review: document.getElementById('review').value || null,
                    cover_image: coverImagePath
                };

                // API呼び出し
                let url = 'api/books.php';
                let method = 'POST';

                if (editMode) {
                    url = `api/books.php?id=${currentBookId}`;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '保存に失敗しました');
                }

                const result = await response.json();
                showMessage(editMode ? '書籍を更新しました' : '書籍を登録しました', 'success');

                setTimeout(() => {
                    location.href = `detail.html?id=${result.id}`;
                }, 1500);

            } catch (error) {
                console.error('Error:', error);
                showMessage('エラー: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = editMode ? '更新' : '登録';
            }
        }

        // 画像をアップロード
        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch('api/upload.php', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error('画像のアップロードに失敗しました');
            }

            const result = await response.json();
            if (!result.success) {
                throw new Error(result.error || '画像のアップロードに失敗しました');
            }

            return result.path;
        }

        // 画像URLから画像をダウンロードしてアップロード
        async function downloadAndUploadImage(imageUrl) {
            try {
                // 画像をBlobとして取得
                const response = await fetch(imageUrl);
                if (!response.ok) {
                    throw new Error('画像のダウンロードに失敗しました');
                }

                const blob = await response.blob();

                // ファイル名を生成
                const filename = 'book_' + Date.now() + '.jpg';

                // BlobをFileオブジェクトに変換
                const file = new File([blob], filename, { type: blob.type || 'image/jpeg' });

                // 通常のアップロード処理
                return await uploadImage(file);

            } catch (error) {
                console.error('Image download error:', error);
                throw new Error('画像のダウンロードに失敗しました: ' + error.message);
            }
        }

        // メッセージ表示
        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // 検索モーダルを開く
        function openSearchModal() {
            const modal = document.getElementById('search-modal');
            const searchInput = document.getElementById('search-input');
            const titleInput = document.getElementById('title');

            // タイトル入力欄の値を検索欄に初期値としてセット
            searchInput.value = titleInput.value;

            modal.style.display = 'flex';
            setTimeout(() => searchInput.focus(), 100);
        }

        // 検索モーダルを閉じる
        function closeSearchModal() {
            const modal = document.getElementById('search-modal');
            modal.style.display = 'none';
            document.getElementById('search-results').innerHTML = '';
        }

        // 書籍を検索
        async function searchBooks() {
            const query = document.getElementById('search-input').value.trim();
            const resultsDiv = document.getElementById('search-results');

            if (!query) {
                resultsDiv.innerHTML = '<p style="text-align: center; color: #666;">検索キーワードを入力してください</p>';
                return;
            }

            resultsDiv.innerHTML = '<div style="text-align: center; padding: 20px;"><div class="spinner"></div><p>検索中...</p></div>';

            try {
                const response = await fetch(`api/search-books.php?q=${encodeURIComponent(query)}`);

                if (!response.ok) {
                    throw new Error('検索に失敗しました');
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">検索結果が見つかりませんでした</p>';
                    return;
                }

                displaySearchResults(data.results);

            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = `<p style="text-align: center; color: red; padding: 20px;">エラー: ${error.message}</p>`;
            }
        }

        // 検索結果を表示
        function displaySearchResults(results) {
            const resultsDiv = document.getElementById('search-results');

            let html = '<div class="search-results-list">';

            results.forEach((book, index) => {
                html += `
                    <div class="search-result-item" onclick="selectBook(${index})">
                        <div class="search-result-image">
                            ${book.thumbnail
                                ? `<img src="${book.thumbnail}" alt="${book.title}" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f0f0f0;color:#999;\\'>画像なし</div>'">`
                                : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f0f0f0;color:#999;">画像なし</div>'}
                        </div>
                        <div class="search-result-info">
                            <h3>${book.title}</h3>
                            ${book.authors ? `<p class="search-result-authors">著者: ${book.authors}</p>` : ''}
                            ${book.publishedDate ? `<p class="search-result-date">出版日: ${book.publishedDate}</p>` : ''}
                            ${book.description ? `<p class="search-result-description">${book.description}</p>` : ''}
                        </div>
                    </div>
                `;
            });

            html += '</div>';

            resultsDiv.innerHTML = html;

            // 検索結果データをグローバル変数に保存
            window.searchResultsData = results;
        }

        // 書籍を選択
        async function selectBook(index) {
            const book = window.searchResultsData[index];

            if (!book) return;

            // タイトルをセット
            document.getElementById('title').value = book.title;

            // 画像がある場合は、画像URLから画像をダウンロードしてプレビュー表示
            if (book.thumbnail) {
                try {
                    // 画像プレビューを表示
                    const preview = document.getElementById('preview');
                    preview.src = book.thumbnail;
                    preview.style.display = 'block';

                    // 画像URLを一時的に保存（送信時にダウンロードして保存）
                    window.selectedBookImageUrl = book.thumbnail;

                    // ファイル入力をクリア
                    document.getElementById('cover_image').value = '';

                } catch (error) {
                    console.error('Image preview error:', error);
                }
            }

            // モーダルを閉じる
            closeSearchModal();

            showMessage('書籍情報を入力しました', 'success');
        }
    </script>
</body>
</html>
