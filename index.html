<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="theme-color" content="transparent">
    <meta name="description" content="読書管理アプリ - あなたの本棚をデジタルで管理">
    <title>わたしの本棚</title>
    <link rel="icon" type="image/x-icon" href="img/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="img/favicon/favicon-48.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- ローディング画面 -->
    <div class="page-loader" id="page-loader">
        <div class="spinner"></div>
        <div class="loader-text">読み込み中...</div>
    </div>

    <div class="page-content" id="page-content">
        <!-- ハンバーガーメニューアイコン -->
        <button class="hamburger-icon" onclick="toggleMenu()" aria-label="メニュー">
            <span></span>
            <span></span>
            <span></span>
        </button>

    <!-- オーバーレイメニュー -->
    <div class="menu-overlay" id="menu-overlay" onclick="closeMenu(event)">
        <div class="controls" onclick="event.stopPropagation()">
            <button class="close-menu" onclick="toggleMenu()">&times;</button>

            <button class="primary" onclick="location.href='register.html'">+ 新しい本を登録</button>

            <div class="sort-group">
                <label for="sort">並び替え:</label>
                <select id="sort" onchange="applyFilters()">
                    <option value="created_at">登録日</option>
                    <option value="start_date">開始日</option>
                    <option value="end_date">終了日</option>
                    <option value="rating">評価</option>
                </select>
            </div>

            <div class="sort-order-group">
                <label>並び順:</label>
                <div class="radio-buttons">
                    <input type="radio" id="sort-desc" name="sort-order" value="desc" checked onchange="applyFilters()">
                    <label for="sort-desc" class="radio-button-label">降順</label>
                    <input type="radio" id="sort-asc" name="sort-order" value="asc" onchange="applyFilters()">
                    <label for="sort-asc" class="radio-button-label">昇順</label>
                </div>
            </div>

            <div class="filter-group">
                <label for="status-filter">状態:</label>
                <select id="status-filter" onchange="applyFilters()">
                    <option value="">すべて</option>
                    <option value="未読">未読</option>
                    <option value="読書中">読書中</option>
                    <option value="読了">読了</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="start-from">開始日:</label>
                <input type="date" id="start-from" onchange="applyFilters()">
                <span>〜</span>
                <input type="date" id="start-to" onchange="applyFilters()">
            </div>

            <button onclick="clearFilters()">フィルタをクリア</button>
        </div>
    </div>

        <div id="message"></div>

        <div class="bookshelf" id="bookshelf"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // ページ読み込み時に書籍を取得
        window.addEventListener('DOMContentLoaded', () => {
            loadFiltersFromStorage();
            loadBooks();
        });

        // 書籍一覧を読み込む
        async function loadBooks() {
            try {
                const params = new URLSearchParams();

                // ソート
                const sortField = document.getElementById('sort').value;
                const sortOrder = document.querySelector('input[name="sort-order"]:checked').value;

                if (sortField) {
                    params.append('sort', sortField + '_' + sortOrder);
                }

                // 状態フィルタ
                const status = document.getElementById('status-filter').value;
                if (status) {
                    params.append('status', status);
                }

                // 開始日フィルタ
                const startFrom = document.getElementById('start-from').value;
                const startTo = document.getElementById('start-to').value;
                if (startFrom) params.append('start_from', startFrom);
                if (startTo) params.append('start_to', startTo);

                const response = await fetch(`api/books.php?${params.toString()}`);
                if (!response.ok) {
                    throw new Error('書籍の取得に失敗しました');
                }

                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                console.error('Error:', error);
                showMessage('書籍の読み込みに失敗しました: ' + error.message, 'error');
                document.getElementById('books-container').innerHTML =
                    '<div class="empty-state"><h3>エラーが発生しました</h3><p>書籍の読み込みに失敗しました</p></div>';
            }
        }

        // メニューの開閉
        function toggleMenu() {
            const overlay = document.getElementById('menu-overlay');
            overlay.classList.toggle('active');
        }

        function closeMenu(event) {
            if (event.target === event.currentTarget) {
                toggleMenu();
            }
        }

        // フィルタをlocalStorageに保存
        function saveFiltersToStorage() {
            const filters = {
                sort: document.getElementById('sort').value,
                sortOrder: document.querySelector('input[name="sort-order"]:checked').value,
                status: document.getElementById('status-filter').value,
                startFrom: document.getElementById('start-from').value,
                startTo: document.getElementById('start-to').value
            };
            localStorage.setItem('mybook_filters', JSON.stringify(filters));
        }

        // localStorageからフィルタを読み込み
        function loadFiltersFromStorage() {
            const saved = localStorage.getItem('mybook_filters');
            if (saved) {
                try {
                    const filters = JSON.parse(saved);

                    // ソート項目を復元
                    if (filters.sort) {
                        document.getElementById('sort').value = filters.sort;
                    }

                    // 並び順を復元
                    if (filters.sortOrder === 'asc') {
                        document.getElementById('sort-asc').checked = true;
                    } else {
                        document.getElementById('sort-desc').checked = true;
                    }

                    // 状態フィルタを復元
                    if (filters.status) {
                        document.getElementById('status-filter').value = filters.status;
                    }

                    // 開始日フィルタを復元
                    if (filters.startFrom) {
                        document.getElementById('start-from').value = filters.startFrom;
                    }
                    if (filters.startTo) {
                        document.getElementById('start-to').value = filters.startTo;
                    }
                } catch (e) {
                    console.error('フィルタの読み込みに失敗しました:', e);
                }
            }
        }

        // localStorageからフィルタをクリア
        function clearFiltersFromStorage() {
            localStorage.removeItem('mybook_filters');
        }

        // 書籍を表示
        function displayBooks(books) {
            const bookshelf = document.getElementById('bookshelf');

            if (books.length === 0) {
                bookshelf.innerHTML =
                    '<div class="empty-state"><h3>本が登録されていません</h3><p>「+ 新しい本を登録」ボタンから本を追加しましょう</p></div>';
                hideLoader();
                return;
            }

            // PC: 10冊、スマホ: 3冊ずつshelfに分割
            const booksPerShelf = window.innerWidth <= 768 ? 3 : 10;
            const shelves = [];

            for (let i = 0; i < books.length; i += booksPerShelf) {
                shelves.push(books.slice(i, i + booksPerShelf));
            }

            bookshelf.innerHTML = shelves.map(shelfBooks => {
                const booksHtml = shelfBooks.map(book => {
                    const coverHtml = book.cover_image
                        ? `<img src="${book.cover_image}" alt="${book.title}" class="book-cover" data-book-id="${book.id}">`
                        : `<div class="no-cover">${book.title}</div>`;

                    const ratingHtml = book.rating
                        ? `<div class="book-rating">${'★'.repeat(book.rating)}</div>`
                        : '';

                    return `
                        <div class="book-card" onclick="location.href='detail.html?id=${book.id}'">
                            ${coverHtml}
                            <div class="book-status-badge status-${book.status}">${book.status}</div>
                            ${ratingHtml}
                        </div>
                    `;
                }).join('');

                return `
                    <div class="shelf">
                        <div class="books-container">
                            ${booksHtml}
                        </div>
                    </div>
                `;
            }).join('');

            // 画像読み込み後に縦横比を設定し、ローダーを非表示
            waitForImagesToLoad().then(() => {
                adjustBookCardHeights();
                hideLoader();
            });
        }

        // 本のカードの高さを画像の縦横比に基づいて調整
        function adjustBookCardHeights() {
            const bookCards = document.querySelectorAll('.book-card');
            const screenWidth = window.innerWidth;
            const booksPerShelf = screenWidth <= 768 ? 3 : 10;

            // カード幅を計算（画面幅の90%を本の数で割る）
            const cardWidth = (screenWidth * 0.9) / booksPerShelf - 20;

            bookCards.forEach(card => {
                const img = card.querySelector('.book-cover');
                if (img && img.tagName === 'IMG') {
                    img.onload = function() {
                        const aspectRatio = this.naturalHeight / this.naturalWidth;
                        const cardHeight = cardWidth * aspectRatio;
                        card.style.width = cardWidth + 'px';
                        card.style.height = cardHeight + 'px';
                    };

                    // 既に読み込まれている場合
                    if (img.complete) {
                        const aspectRatio = img.naturalHeight / img.naturalWidth;
                        const cardHeight = cardWidth * aspectRatio;
                        card.style.width = cardWidth + 'px';
                        card.style.height = cardHeight + 'px';
                    }
                } else {
                    // no-coverの場合は通常の縦横比（3:4）
                    const cardHeight = cardWidth * 1.5;
                    card.style.width = cardWidth + 'px';
                    card.style.height = cardHeight + 'px';
                }
            });
        }

        // ウィンドウリサイズ時に再計算
        window.addEventListener('resize', () => {
            if (window.resizeTimeout) {
                clearTimeout(window.resizeTimeout);
            }
            window.resizeTimeout = setTimeout(() => {
                loadBooks();
            }, 200);
        });

        // フィルタを適用
        function applyFilters() {
            saveFiltersToStorage();
            loadBooks();
        }

        // フィルタをクリア
        function clearFilters() {
            document.getElementById('sort').value = 'created_at';
            document.getElementById('sort-desc').checked = true;
            document.getElementById('status-filter').value = '';
            document.getElementById('start-from').value = '';
            document.getElementById('start-to').value = '';
            clearFiltersFromStorage();
            loadBooks();
        }

        // 全ての画像の読み込みを待つ
        function waitForImagesToLoad() {
            const images = document.querySelectorAll('.book-cover[src]');
            if (images.length === 0) {
                return Promise.resolve();
            }

            const promises = Array.from(images).map(img => {
                return new Promise((resolve) => {
                    if (img.complete) {
                        resolve();
                    } else {
                        img.onload = () => resolve();
                        img.onerror = () => resolve(); // エラーでも続行
                    }
                });
            });

            return Promise.all(promises);
        }

        // ローダーを非表示にしてページをフェードイン
        function hideLoader() {
            const loader = document.getElementById('page-loader');
            const content = document.getElementById('page-content');

            // ローダーをフェードアウト
            loader.classList.add('hidden');

            // コンテンツをフェードイン
            setTimeout(() => {
                content.classList.add('visible');
            }, 100);

            // ローダーを完全に削除
            setTimeout(() => {
                loader.style.display = 'none';
            }, 600);
        }

        // メッセージ表示
        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // PWA登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered:', registration))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
